<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>REMAJU Auctions</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg:#0f172a; --panel:#111827; --text:#e5e7eb; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #1f2937;
  }

  header img {
    height: 30px;
    width: auto;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: .3px;
  }

  /* ---- Report container ---- */
  .wrapper {
    position: relative;
    overflow: hidden;       /* hides footer */
    width: 95%;
    max-width: 1600px;
    height: 88vh;           /* adjust to fit screen */
    margin-top: 16px;
    margin-bottom: 24px;
    border-radius: 10px;
    box-shadow: 0 0 6px rgba(0,0,0,0.4);
  }

  .wrapper iframe {
    position: absolute;
    bottom: -35px;          /* hide gray Power BI footer */
    left: 0;
    width: 100%;
    height: calc(100% + 35px);
    border: none;
    border-radius: 10px;
    background: #0b1220;
  }

  @media (max-width: 768px) {
    header {
      flex-direction: column;
      gap: 4px;
      text-align: center;
    }
    h1 {
      font-size: 16px;
    }
    header img {
      height: 24px;
    }
  }
</style>
</head>
<body>

<header style="display:flex;align-items:center;justify-content:center;padding:8px 16px;position:relative;">
  
  <!-- Left-logo -->
  <img src="logo.png" style="height:25px;position:absolute;left:50px;top:50%;transform:translateY(-50%);">

  <!-- Center-title -->
  <span style="font-size:20px;font-weight:600;color:white;">
    REMAJU Auctions – Properties on Sale
  </span>

</header>

<div class="wrapper">
  <iframe 
    loading="lazy"
    src="https://app.powerbi.com/view?r=eyJrIjoiODkwZGIzNmQtNTBjNC00MTMzLTkwYjctNjc2ZDM1ZDQ5OWVkIiwidCI6IjhhNjJiMDNjLWZlMGItNGY5YS04Y2VkLWQwYjAxOGI5YmM3ZiIsImMiOjR9">
  </iframe>
</div>

</body>
</html>
