<!-- Doc Configuration -->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MarketWatch</title>
  <style>
    :root { --bg:#0b1220; --card:#0f1629; --fg:#e6edf3; --muted:#a8b3cf; }
    html,body{margin:0;background:var(--bg);color:transparent;font-family:system-ui,Segoe UI,Roboto,Ubuntu,sans-serif}
    .wrap{max-width:1100px;margin:28px auto;padding:0 16px}
    header{margin-bottom:16px;font-weight:700;font-size:20px;letter-spacing:.2px}
    .card{background:transparent;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.25)}
    .card h2{margin:0;padding:12px 16px;font-size:16px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.06)}
    .widget{height:460px;}          /* 👈 control widget height here */
    .widget.news{ height:600px;}   /* News widget height and wid */
    .widget.news{ width:100%; }
    .widget.symbol{ height:20px;}  
    /* Two columns: News (left) + Plan (right) */
    .twocol{
      display:grid;
      grid-template-columns: 1fr 1fr;   /* tweak ratio if you want */
      gap:16px;
      align-items:start;
    }
    @media (max-width: 900px){
      .twocol{ grid-template-columns: 1fr; } /* stack on mobile */
    }

    @media (max-width:640px){ .widget{height:380px} }

    /* Notes card */
    .note-card .grid{
      display:grid; gap:12px;
      grid-template-columns: repeat(2, minmax(0,1fr));
    }
    .note-card label{ font-size:12px; color:var(--muted); display:block; margin-bottom:6px;}
    .note-card input[type="text"],
    .note-card select,
    .note-card textarea{
      width:100%; box-sizing:border-box;
      padding:10px 12px; border-radius:10px;
      background:#0f1629; color:var(--fg);
      border:1px solid #2a3557; outline:none;
    }
    .note-card textarea{ min-height:120px; resize:vertical; }
    .note-card .full{ grid-column:1 / -1; }
    .note-card .row{ display:flex; gap:12px; align-items:center; }
    .note-card .muted{ color:var(--muted); font-size:12px; }
    .note-card .actions{ display:flex; gap:10px; }
    .note-card button{
      background:#1b2746; color:#e6edf3; border:1px solid #31406a;
      padding:8px 12px; border-radius:10px; cursor:pointer;
    }
    .note-card button:hover{ background:#233158; }
    @media (max-width:720px){
      .note-card .grid{ grid-template-columns:1fr; }
    }

  </style>
</head>

<script>
  // change this if you switch symbol (so each symbol keeps its own notes)
  const NOTES_KEY = 'notes_XAUUSD';

  const fields = ['projection','entry1','entry2','exit1','exit2','fundamental','notes'];

  function loadNotes(){
    try{
      const saved = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}');
      fields.forEach(id => { const el = document.getElementById(id); if(el && saved[id] != null) el.value = saved[id]; });
    }catch(e){}
  }
  function saveNotes(){
    const data = {};
    fields.forEach(id => { const el = document.getElementById(id); if(el) data[id] = el.value; });
    localStorage.setItem(NOTES_KEY, JSON.stringify(data));
  }
  function bindNotes(){
    fields.forEach(id => {
      const el = document.getElementById(id);
      if(el){ el.addEventListener('input', saveNotes); }
    });
    const clr = document.getElementById('clearNotes');
    if(clr){
      clr.addEventListener('click', () => {
        fields.forEach(id => { const el = document.getElementById(id); if(el){ el.value=''; } });
        saveNotes();
      });
    }
  }
  loadNotes(); bindNotes();
</script>

        <div class="full">
          <label for="notes">Notes</label>

        </div>
      </div>
