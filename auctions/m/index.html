<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>REMAJU — Mobile Report (Zoomed & Centered Fixed)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg:#000000; --text:#e5e7eb; --maskH:40px; }

  html, body {
    margin:0; padding:0;
    height:100%; width:100%;
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto;
    overflow:hidden;
  }

  .viewport {
    position:fixed; inset:0;
    overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    background:#000000;
    padding-bottom:var(--maskH);
  }

  .canvas { position:relative; min-height:100vh; }

  .zoomed {
    position:relative;
    transform-origin:top left;
    will-change:transform,left;
    transition:left 0.2s ease;
  }

  iframe {
    display:block;
    border:0;
    background:#000000;
    width:100vw;
    height:calc(100vh + var(--maskH));
  }

  .footer-mask {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 0px;          /* empieza invisible */
    background: #000000;  /* tu mismo color */
    z-index: 9999;        /* por encima de todo */
    pointer-events: auto; /* no bloquea toques */

  }

  .topbar {
  position: sticky; /* or fixed */
  top: 0px;
  z-index: 10;
  background: #000;
  color: #fff;

  height: 33px;                 /* fixed height for perfect centering */
  display: flex;                /* flexbox centers vertically */
  align-items: center;          /* vertical centering */
  justify-content: center;      /* horizontal centering */



  border-bottom: 1px solid #333;
  font-family: "Segoe UI", sans-serif;
  padding: 2px 4px;

  font-size: 7px;
  text-align: center;

  transform: translateX(0px);
}

.topbar .brand {
  top:5px;
  display: block;
  font-size: 10px;
  opacity: 0.7;
  margin-top: -10px;
  font-family: "Segoe UI", sans-serif;
} 

  .report-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  .loader-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    background: #0b0c10;
    padding-top: 20px; 
    color: #f5f5f5;
    z-index: 9999;
  }

  .loader-logo {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .loader-text {
    font-size: 12px;
    opacity: 0.8;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

</style>
</head>



<body>


<div class="topbar">
  <h1>REMAJU Auctions</h1>


</div>



<div class="report-wrapper">

  <!-- LOADING SCREEN -->
  <div id="loader" class="loader-overlay">
    <div class="loader-logo">Finsight</div>
    <div class="spinner"></div>
    <div class="loader-text">Uploading auctions…</div>
  </div>

  <!-- Viewport -->
  <div id="viewport" class="viewport">
    <div id="canvas" class="canvas">
      <div id="zoomed" class="zoomed">
        <iframe
          loading="lazy"
          src="https://app.powerbi.com/view?r=eyJrIjoiMzEyM2MzNzItNzRiOC00MjQ1LWJhYzktY2ViNzU0YmY2NDdjIiwidCI6IjhhNjJiMDNjLWZlMGItNGY5YS04Y2VkLWQwYjAxOGI5YmM3ZiIsImMiOjR9"
          onload ="scheduleHideLoader()">
        </iframe>
      </div>
    </div>
  </div>

</div>



<div class="footer-mask"></div>

<script>  
  // zoom factor and small manual horizontal correction (px)
  let zoom = 2.5;
  let correction = 120; // shift right by 20px — tweak if needed (try 10–40)

  function applyLayout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const zoomed = document.getElementById('zoomed');

    // apply zoom
    zoomed.style.transform = `scale(${zoom})`;

    // center horizontally
    const scaledW = vw * zoom;
    const leftOffset = (vw - scaledW) / 2 + correction;
    zoomed.style.left = leftOffset + 'px';

    // adjust height for scroll
    const canvas = document.getElementById('canvas');
    const maskH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--maskH'));
    const totalH = (vh + maskH) * zoom;
    canvas.style.minHeight = totalH + 'px';
  }

  applyLayout();
  addEventListener('resize', applyLayout);
  addEventListener('orientationchange', applyLayout);

  
  function updateFooterMask() {
  const vp = document.querySelector('.viewport');
  const mask = document.querySelector('.footer-mask');

  // cuánto falta para llegar al final
  const scrollBottom = vp.scrollHeight - (vp.scrollTop + vp.clientHeight);

  const maxMask = 195;  // altura máxima de la máscara (ajustable)

  if (scrollBottom < maxMask) {
    mask.style.height = maxMask  + "px";
  } else {
    mask.style.height = "0px";
  }
}

document.querySelector('.viewport')
        .addEventListener('scroll', updateFooterMask);

updateFooterMask();

  // ✅ NUEVA FUNCIÓN DE CIERRE DEL LOADER
  const loaderShownAt = Date.now();      // cuándo empezó a mostrarse
  const MIN_VISIBLE = 5000;             // 👈 mínimo 5s visible
  const MAX_VISIBLE = 15000;            // 👈 máximo 15s

  function hideLoader() {
    const loader = document.getElementById('loader');
    if (loader) {
      loader.style.opacity = "0";          // fade out
      loader.style.pointerEvents = "none"; // no bloquea toques
      setTimeout(() => {
        loader.style.display = "none";
      }, 300); // mismo que transition en CSS
    }
  }

  // llamada por onload del iframe
  function scheduleHideLoader() {
    const elapsed = Date.now() - loaderShownAt;
    const remaining = Math.max(MIN_VISIBLE - elapsed, 0);
    setTimeout(hideLoader, remaining);
  }

  // backup: aunque falle el onload, a los MAX_VISIBLE segundos se va sí o sí
  setTimeout(hideLoader, MAX_VISIBLE);


</script>

</body>
</html>
