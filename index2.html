<!-- Doc Configuration -->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Market Watch</title>
  <style>
    :root { --bg:#0b1220; --card:#0f1629; --fg:#e6edf3; --muted:#a8b3cf; }
    html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,Ubuntu,sans-serif}
    .wrap{max-width:1100px;margin:28px auto;padding:0 16px}
    header{margin-bottom:16px;font-weight:700;font-size:20px;letter-spacing:.2px}
    .card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.25)}
    .card h2{margin:0;padding:12px 16px;font-size:16px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.06)}
    .widget{height:460px;}          /* 👈 control widget height here */
    @media (max-width:640px){ .widget{height:380px} }
  </style>
</head>

<!-- Body Characteristics -->
 <body>

  <div class="wrap">
    <header>My Market View</header>


<!-- Layout-->
<div class="layout">
  <!-- LEFT: CHART -->
  <div class="card">
    <h2 id="chartTitle">Chart</h2>
    <div class="widget">
      <div class="tradingview-widget-container" style="height:100%">
        <div id="tv-advanced" class="tradingview-widget-container__widget" style="height:100%"></div>
        <script src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
        {
            "autosize": true,
            "theme": "dark",
            "symbol": "FX_IDC:USDPEN",
            "interval": "D",
            "style": "3",
            "allow_symbol_change": false,
            "withdateranges": true,
            "backgroundColor": "#0F0F0F"
        }
        </script>
      </div>
    </div>
  </div>

  <!-- RIGHT: NOTES -->
  <aside class="card">
    <h2 id="noteTitle">Notes</h2>
    <div class="note-body">
      <div class="row">
        <span class="muted">    S&R 3.4 - 3.6 </span>
    </div>
  </aside>
</div>
